#version: "3.9"


services:
  database:
    image: postgres:16
    container_name: voa-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backnet

  redis:
    image: redis:7
    container_name: voa-redis
    env_file:
      - .env
    command: ["redis-server", "/etc/redis/redis.conf"]
    depends_on:
      database:
        condition: service_healthy
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backnet
    volumes:
      - ./infrastructure/redis/redis.conf:/etc/redis/redis.conf


  backend:
    build: ./backend
    image: voa-backend:latest
    container_name: voa-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 40s
    networks:
      - backnet
      - frontnet

  nginx:
    image: nginx:alpine
    container_name: voa-nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx_status || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - frontnet
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf

  prometheus:
    image: prom/prometheus:latest
    container_name: voa-prometheus
    ports:
      - "9090:9090"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      database:
        condition: service_healthy
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9090 || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backnet
      - frontnet
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: voa-grafana
    ports:
      - "3030:3030"
    restart: always
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - backnet
      - frontnet
    volumes:
      - ./infrastructure/grafana/grafana.ini:/etc/grafana/grafana.ini

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: voa-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - backnet
      - monitoring
    depends_on:
      database:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: voa-redis-exporter
    environment:
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - backnet
      - monitoring
    depends_on:
      - redis

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: voa-nginx-exporter
    ports:
      - "9113:9113"
    command: ["-nginx.scrape-uri", "http://nginx/stub_status"]
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontnet
      - monitoring

networks:
  frontnet:
    driver: bridge
  backnet:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  pgdata: