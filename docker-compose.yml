# version: "3.9"

services:
  database:
    image: postgres:16
    container_name: voa-db
    restart: always
    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - backnet



  backend:
    build: ./backend
    container_name: voa-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backnet
      - frontnet


  frontend:
    build: ./frontend
    container_name: voa-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - frontnet

networks:
  frontnet:
    driver: bridge
  backnet:
    driver: bridge

volumes:
  pgdata:
