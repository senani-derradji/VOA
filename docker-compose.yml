version: "3.9"

services:
  database:
    image: postgres:16
    container_name: voa-db
    restart: always
    env_file:
      - .envDocker
    environment:
      POSTGRES_USER: derradji
      POSTGRES_PASSWORD: derradji1212
      POSTGRES_DB: SMB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backnet
  backend:
    build: ./backend
    container_name: voa-backend
    ports:
      - "8000:8000"
    env_file:
      - .envDocker
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://derradji:derradji1212@database:5432/SMB
    volumes:
      - ./backend:/app
    depends_on:
      - database
    networks:
      - backnet
      - frontnet

  frontend:
    build: ./frontend
    container_name: voa-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - frontnet

networks:
  frontnet:
    driver: bridge
  backnet:
    driver: bridge

volumes:
  pgdata:
